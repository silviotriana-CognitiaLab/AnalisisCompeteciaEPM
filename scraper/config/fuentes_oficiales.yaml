# Fuentes independientes/oficiales por tipo de dato.
# tipo_fuente aquí es casi siempre "independiente" (regulador, gremio, dato
# abierto). Se marca "autorreportado" solo si la fuente es la propia empresa.
#
# metodo:
#   http_api    -> endpoint estructurado (JSON/CSV), sin necesidad de navegador
#   http_simple -> HTML servido sin bloqueo anti-bot conocido
#   headless    -> requiere navegador (Playwright) por JS o bloqueo de user-agent

regulacion:
  - id: xm_paratec
    nombre: "XM - Portal BI / Paratec (generación por agente, capacidad instalada)"
    tipo_fuente: independiente
    url: "https://www.xm.com.co"
    metodo: headless
    notas: "En el informe previo, WebFetch a xm.com.co fue posible solo vía síntesis de búsqueda; confirmar si tiene API pública antes de asumir headless."

  - id: sui_superservicios
    nombre: "SUI - Sistema Único de Información de Servicios Públicos"
    tipo_fuente: independiente
    url: "https://www.sui.gov.co"
    metodo: headless
    notas: "Fuente clave para número total de usuarios por empresa/departamento (no accedida en el informe previo)."

  - id: superservicios_boletines
    nombre: "Superservicios - Boletines tarifarios y de PQR"
    tipo_fuente: independiente
    url: "https://www.superservicios.gov.co"
    metodo: headless
    notas: "Los PDF de este dominio dieron 403 en el informe previo con WebFetch; probar con navegador headless real."

  - id: datos_abiertos_pqr
    nombre: "Datos Abiertos Colombia - dataset PQR de Superservicios"
    tipo_fuente: independiente
    url: "https://www.datos.gov.co"
    metodo: http_api
    resource_id: "TODO-buscar-resource-id-exacto"
    notas: >
      Buscar en datos.gov.co el dataset 'Reclamaciones y Quejas Inf. PQR' de
      Superservicios y pegar aquí su resource_id de Socrata (formato
      xxxx-xxxx) antes de activar este collector. No se inventa un ID.

  - id: creg
    nombre: "CREG - Comisión de Regulación de Energía y Gas"
    tipo_fuente: independiente
    url: "https://www.creg.gov.co"
    metodo: headless

  - id: upme
    nombre: "UPME - Unidad de Planeación Minero Energética (Plan de Expansión de Generación)"
    tipo_fuente: independiente
    url: "https://www.upme.gov.co"
    metodo: headless

expansion_negocio:
  - id: secop_ii
    nombre: "SECOP II - contratación pública (licitaciones de alumbrado, agua, etc.)"
    tipo_fuente: independiente
    url: "https://www.colombiacompra.gov.co"
    metodo: http_api
    notas: >
      SECOP II expone datasets en Socrata vía datos.gov.co
      (dataset 'SECOP II - Procesos de Contratación'). Preferir esa API
      sobre scraping del portal transaccional.
