# Registro de competidores por sector.
#
# confianza:
#   alta   -> verificado en el informe existente (./informes/) o fuente reciente sólida
#   media  -> conocimiento general razonable, sin verificación reciente en este repo
#   baja   -> mención plausible, requiere validación antes de citarse en un informe
#   completar -> placeholder puesto por el diseño del proyecto; el usuario debe
#                completar/corregir con su conocimiento del sector antes de usarlo
#
# sala_prensa / ir: URLs semilla para el collector de noticias (headless).
# Deja la lista vacía y usa el buscador (WebSearch, vía el subagente
# inteligencia-estrategica) mientras no se validen URLs concretas.

energia_electrica:
  - id: epm
    nombre: "EPM (Grupo EPM)"
    confianza: alta
    sitio: "https://www.epm.com.co"
    notas: "Empresa propia (referencia, no competidor)."
