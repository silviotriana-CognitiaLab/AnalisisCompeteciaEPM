# Registro de competidores por sector.
#
# confianza:
#   alta   -> verificado en el informe existente (./informes/) o con fuente
#             de prensa/comunicado independiente sólido encontrado en esta sesión
#   media  -> fuente encontrada, pero de un solo medio o con vigencia a confirmar
#             (contratos/concesiones que pueden haber cambiado de manos)
#   baja   -> solo aparece en el propio sitio de la empresa o en contenido
#             de marketing de OTRO competidor (nunca tratar como independiente);
#             requiere validación antes de citarse en un informe
#   completar -> placeholder puesto por el diseño del proyecto; ya no debería
#                quedar ninguno en este archivo (ver historial de commits si
#                aparece uno nuevo al agregar un sector)
#
# fuentes_noticias: URLs semilla para el collector de noticias (headless).
# Deja la lista vacía y usa el buscador (WebSearch, vía el subagente
# inteligencia-estrategica) mientras no se validen URLs concretas de sala
# de prensa por competidor.

