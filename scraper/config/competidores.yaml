generacion_solar_ppa_epc:
  - id: celsia_solar
    nombre: "Celsia Solar / Celsia EaaS (Atera con Brookfield)"
    confianza: media
    sitio: "https://www.celsia.com"
  - id: enel_x
    nombre: "Enel X Colombia"
    confianza: baja
    sitio: ""
    notas: "Verificar si Enel X sigue operando como marca separada en Colombia."
  - id: greenyellow
    nombre: "GreenYellow Colombia"
    confianza: alta
    sitio: "https://greenyellow.co"
    notas: >
      Verificado con prensa independiente (Portafolio, PV Magazine
      Latinoamérica) y comunicados propios: opera bajo modelo PPA (parque
      solar "Jardín", 14,55 MWp en Valencia de Jesús, Cesar) y bajo
      EPC/autogeneración C&I (planta de 1,45 MWp para Cerámica Industrial
      del Meta - CIMET, Acacias). También reporta proyectos de generación
      distribuida en el Atlántico. Confianza alta en "existe y opera
      activamente en Colombia en PPA/EPC C&I"; las cifras exactas de
      capacidad siguen siendo autorreportadas por GreenYellow.
  - id: atlas_renewable
    nombre: "Atlas Renewable Energy"
    confianza: baja
    sitio: ""
    notas: "Más enfocado en proyectos de gran escala/utility PPA que en techos C&I; confirmar segmento real."
  - id: erco_energia
    nombre: "Erco Energía"
    confianza: alta
    sitio: "https://erco.energy/co"
    notas: >
      Empresa paisa (Medellín, fundada 2012), solar residencial y C&I;
      cerró ronda Serie C de USD 129 millones co-liderada por Next Utility
      Ventures, el fondo de capital de riesgo de Ventures EPM — es decir,
      EPM (a través de su propio vehículo de inversión) es inversionista
      de un competidor de generación solar distribuida, dato relevante
      para el análisis. Fuente independiente: Finance Colombia, El
      Colombiano, perfil corporativo en LinkedIn/Crunchbase/EMIS. La cifra
      de "36,4% de participación de mercado" que Erco publica en su propio
      blog (erco.energy) es AUTORREPORTADA por Erco sobre sí misma — no se
      presenta como hecho independiente.
  - id: metalenergy
    nombre: "Metalenergy"
    confianza: baja
    sitio: "https://metalenergy.co"
    notas: >
      Ofrece modelos EPC (cliente dueño del activo) y PPA (sin inversión
      inicial) para C&I, según su propio sitio. No se encontró cobertura
      de prensa independiente que lo confirme; validar antes de citarlo en
      un informe.
  - id: emergente_energia
    nombre: "Emergente Energía"
    confianza: baja
    sitio: ""
    notas: >
      Descrito (proyectos industriales en minería/petroquímica/
      manufactura pesada, ~900 instalaciones en 7 años) SOLO en el blog de
      un competidor (erco.energy) que se autopromociona como líder del
      ranking — es contenido de marketing de Erco Energía comparándose con
      otros, no fuente independiente. Validar con fuente propia antes de
      usar.
  - id: autosolar
    nombre: "AutoSolar"
    confianza: baja
    sitio: ""
    notas: >
      Mismo origen que emergente_energia: solo aparece caracterizada
      (distribuidor de equipos + EPC para 20-100 kWp) en el blog de un
      competidor (erco.energy). Validar con fuente propia.

alumbrado_publico:
  # Es un mercado de concesiones municipales: no hay un jugador nacional
  # único, y los contratos cambian de manos con cada licitación. Antes de
  # citar cualquiera de estas entradas en un informe, confirmar vigencia
  # actual del contrato (varias fuentes de abajo mencionan procesos de
  # cambio de operador en curso).
  - id: barranquilla_capital_de_luz
    nombre: >
      Barranquilla Capital de Luz (consorcio: Eléctricas de Medellín
      Ingeniería y Servicios S.A.S., Iluminación de Villavicencio S.A.S.,
      Celsa S.A.S.)
    confianza: media
    sitio: ""
    notas: >
      Socio privado seleccionado por convocatoria pública para el
      alumbrado público de Barranquilla, según La Silla Vacía. Verificar
      vigencia actual del contrato antes de citarlo.
  - id: iluminemos_cartagena
    nombre: "Iluminemos Cartagena (Electroconstrucciones + ISM SA)"
    confianza: baja
    sitio: ""
    notas: >
      Operador privado del alumbrado público de Cartagena desde 1998
      según La Contratopedia Caribe, pero el mismo medio reporta que el
      Distrito asumió la operación de forma temporal más recientemente —
      CONFIRMAR si Iluminemos Cartagena sigue vigente o ya cambió de
      operador antes de usarlo en un informe.
  - id: megaproyectos_iluminaciones
    nombre: "Megaproyectos de Iluminaciones (Cali)"
    confianza: baja
    sitio: ""
    notas: >
      Concesionario del alumbrado público de Cali durante 24 años desde
      el año 2000, según El Tiempo, pero el mismo artículo indica que Cali
      está evaluando alternativas al terminar esa concesión — CONFIRMAR si
      sigue vigente.
  - id: agm_desarrollos
    nombre: "AGM Desarrollos S.A.S. (Aguachica, Cesar)"
    confianza: media
    sitio: ""
    notas: >
      Concesionario del alumbrado público de Aguachica, bajo investigación
      preliminar de la Procuraduría (enero 2026) por presunto sobrecosto
      en el contrato de alumbrado navideño de la misma concesión — ver
      también alumbrado_navideno.

alumbrado_navideno:
  # Mercado muy fragmentado y local: cada alcaldía licita por separado y el
  # adjudicatario cambia cada año, a veces sin relación con el mercado de
  # alumbrado_publico permanente (ver caso Sabaneta-Bucaramanga: una
  # empresa de servicios públicos de OTRA ciudad ganó el contrato). Antes
  # de cada temporada (jul-oct) conviene correr el collector de
  # expansion_negocio sobre SECOP en vez de asumir que el mismo jugador se
  # repite.
  - id: sabaneta_esp_bucaramanga
    nombre: "Empresa de Servicios Públicos Domiciliarios de Sabaneta (Antioquia)"
    confianza: media
    sitio: ""
    notas: >
      Adjudicataria directa (sin proceso de selección competitivo) del
      contrato de alumbrado navideño 2025 de Bucaramanga (~$7.000 millones
      COP, contrato 255/2024), bajo investigación de la Contraloría y la
      Procuraduría por presuntas irregularidades. Subcontrató la
      instalación real a Civacom Ingeniería S.A.S. Fuentes: El Tiempo,
      Vanguardia, Infobae, BluRadio (dic. 2025 - ene. 2026).
  - id: civacom_ingenieria
    nombre: "Civacom Ingeniería S.A.S. (Bucaramanga)"
    confianza: media
    sitio: ""
    notas: >
      Subcontratista que ejecutó realmente la instalación del alumbrado
      navideño 2025 de Bucaramanga (~$6.271 millones COP), tras ser
      subcontratado por sabaneta_esp_bucaramanga. Ver esa entrada.
  - id: agm_desarrollos
    nombre: "AGM Desarrollos S.A.S. (Aguachica, Cesar)"
    confianza: media
    sitio: ""
    notas: >
      Concesionario de alumbrado público de Aguachica al que se le pagaron
      ~$2.400 millones COP por el alumbrado navideño 2025 (solo para la
      plaza principal y el parque San Roque), bajo investigación
      preliminar de la Procuraduría por presunto sobrecosto (Infobae,
      ene. 2026). Ver también alumbrado_publico.
  - id: epm_medellin_referencia
    nombre: "EPM / Municipio de Medellín (alumbrado navideño de Medellín)"
    confianza: alta
    sitio: ""
    notas: >
      Es la propia EPM, no un competidor: referencia de escala (8 millones
      de luces LED en la temporada 2025-2026, encendido 28 nov. 2025) para
      comparar contra los contratos, presupuestos y controversias de otras
      ciudades. Fuente: Infobae, nov. 2025.

