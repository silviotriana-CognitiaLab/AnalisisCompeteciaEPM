alumbrado_publico:
  - id: completar_1
    nombre: "COMPLETAR: concesionario/operador de alumbrado público"
    confianza: completar
    sitio: ""
    notas: >
      No se listan nombres por defecto para evitar afirmar jugadores no
      verificados en un mercado que varía mucho por municipio y depende de
      licitaciones SECOP vigentes. Completar con los operadores conocidos
      en las ciudades de interés (p.ej. concesionario de alumbrado de
      Bogotá, Medellín, etc.) y dejar que el collector de expansion_negocio
      (SECOP) descubra nuevos entrantes por licitación.

